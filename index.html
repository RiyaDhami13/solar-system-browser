<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Solar System Browser — 3D</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#020510; overflow:hidden; font-family:monospace; }
    canvas { display:block; }

    #hud {
      position:fixed; top:0; left:0; right:0;
      padding:1.2rem 1.5rem;
      display:flex; justify-content:space-between; align-items:center;
      pointer-events:none; z-index:10;
    }
    #title {
      font-size:1rem; color:#F5C842;
      letter-spacing:0.2em; text-transform:uppercase;
    }
    #title span {
      display:block; font-size:0.6rem;
      color:rgba(200,223,245,0.4);
      margin-top:0.2rem; letter-spacing:0.25em;
    }
    #tooltip {
      position:fixed; top:1.5rem; left:50%;
      transform:translateX(-50%);
      font-size:0.8rem; color:#F5C842;
      letter-spacing:0.2em; text-transform:uppercase;
      opacity:0; transition:opacity 0.2s;
      pointer-events:none; z-index:10;
    }
    #info-panel {
      position:fixed; right: 0; bottom: 0; top: 0; 
      width:300px;
      background:rgba(2,5,16,0.97);
      border-left:1px solid rgba(0,229,255,0.12);
      padding:2rem 1.5rem 1.5rem;
      transform:translateX(100%);
      transition:transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94);
      pointer-events:none; z-index:20;
      overflow-y: auto;
    }

#info-panel.visible {
  transform:translateX(0);
  pointer-events:auto;
}


#panel-close {
  position:absolute; top:1rem; right:1rem;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  color:rgba(200,223,245,0.6);
  border-radius:50%; width:28px; height:28px;
  cursor:pointer; font-size:0.8rem;
}

#p-type-label {
  font-size:0.6rem; color:rgba(0,229,255,0.6);
  letter-spacing:0.2em; text-transform:uppercase;
  margin-bottom:0.3rem;
}
#p-name {
  font-size:1.8rem; color:#F5C842;
  letter-spacing:0.05em;
  margin-bottom:1.2rem; padding-bottom:1rem;
  border-bottom:1px solid rgba(255,255,255,0.07);
}
#panel-tabs {
  display:flex; margin-bottom:1.2rem;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.tab {
  flex:1; padding:0.5rem 0;
  background:none; border:none;
  border-bottom:2px solid transparent;
  color:rgba(200,223,245,0.35);
  cursor:pointer; font-family:monospace;
  font-size:0.62rem; letter-spacing:0.1em;
  text-transform:uppercase; transition:all 0.2s;
}
.tab.active { color:#F5C842; border-bottom-color:#F5C842; }
#panel-content {
  font-size:0.78rem;
  color:rgba(200,223,245,0.7);
  line-height:1.7;
}

.fact-row {
  display:flex; justify-content:space-between;
  padding:0.4rem 0;
  border-bottom:1px solid rgba(255,255,255,0.05);
  font-size:0.72rem;
}
.fact-row .label { color:rgba(200,223,245,0.4); }
.fact-row .value { color:rgba(200,223,245,0.9); }
.milestone { display:flex; gap:0.8rem; padding-bottom:1rem; }
.milestone-year { font-size:0.75rem; color:#F5C842; min-width:36px; padding-top:2px; }
.milestone-event { font-size:0.72rem; color:rgba(200,223,245,0.65); line-height:1.5; }


#controls {
      position:fixed; top:1.5rem; right:1.5rem;
      display:flex; align-items:center; gap:0.8rem;
      z-index:10;
    }

    .ctrl-btn {
      padding:0.35rem 0.9rem;
      background:rgba(0,229,255,0.07);
      border:1px solid rgba(0,229,255,0.25);
      color:rgba(200,223,245,0.7);
      border-radius:3px; cursor:pointer;
      font-family:monospace; font-size:0.7rem;
      letter-spacing:0.1em; transition:all 0.2s;
    }
    .ctrl-btn:hover {
      background:rgba(245,200,66,0.1);
      border-color:rgba(245,200,66,0.4);
      color:#F5C842;
    }
  </style>
</head>
<body>

  <div id="hud">
    <div id="title">
      ☀ Solar System Browser
      <span>Week 2 · Full 3D System</span>
    </div>
  </div>

  <div id="controls">
    <button class="ctrl-btn" id="pause-btn">⏸ Pause</button>
    <button class="ctrl-btn" id="reset-btn">⟳ Reset View</button>
  </div>

  <div id="tooltip"></div>

  <div id ="info-panel">
    <button id="panel-close"></button>
    <div id="p-type-label">-</div>
    <div id="p-name">-</div>
    <div id="panel-tabs">
      <button class="tab active" data-tab="facts">Facts</button>
      <button class="tab" data-tab="milestones">Milestones</button>
      <button class="tab" data-tab="funfact">Did You Know</button>
    </div>
    <div id="panel-content"></div>
  </div>

  <div id="instructions">
    DRAG to orbit · SCROLL to zoom · CLICK planet to inspect
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!--Sun vertex shader-->
  <script id="sunVertexShader" type="x-Shader/x-Vertex">
    varying vec3 vNormal;
    varying vec3 vPosition;

    void main() {
      vNormal = normalize(normalMatrix * normal);
      vPosition = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  </script>

  <!--Sun Fragment Shader-->
  <script id="sunFragmentShader" type="x-shader/x-fragment">
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vPosition;



  float noise(vec3 p) {
    return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453);
  }
  
  <!--Smoother noise-->
    float smoothNoise(vec3 p) {
      vec3 i = floor(p);
      vec3 f = fract(p);
      f = f * f * (3.0-2.0 * f);
      return mix(
        mix(mix(noise(i), noise(i+vec3(1,0,0)), f.x),
          mix(noise(i+vec3(0,1,0)), noise(i+vec3(1,1,0)), f.x), f.y),
      mix(mix(noise(i+vec3(0,0,1)), noise(i+vec3(1,0,1)), f.x),
          mix(noise(i+vec3(0,1,1)), noise(i+vec3(1,1,1)), f.x), f.y),
      f.z
      );
    }

    void main() {
      float n = smoothNoise(vPosition * 1.8 + uTime * 0.12);
      n += 0.5 * smoothNoise(vPosition * 3.6 + uTime * 0.20);
      n += 0.25 * smoothNoise(vPosition * 7.2 + uTime * 0.30);
      n /= 1.75;

      vec3 deepColor = vec3(0.95,0.20,0.00);
      vec3 midColor = vec3(1.00,0.55,0.00);
      vec3 brightColor = vec3(1.00,0.90,0.40);

      vec3 col = mix(deepColor,midColor,n);
      col = mix(col,brightColor,pow(n,2.5));

      float limb = dot(vNormal,vec3(0.0,0.0,1.0));
      col *= (0.4 * 0.6 * limb);

      gl_FragColor = vec4(col,1.0);
    }
  </script>

  <script>

    
    // PLANET DATA
    
    const PLANETS = [
      { id:'mercury', name:'Mercury', distance:10,  radius:0.5, color:'#B5B5B5', speed:0.040, tilt:0.03,  period:'88 days',   temp:'-180 to 430°C', moons:0,   type:'Rocky'    },
      { id:'venus',   name:'Venus',   distance:16,  radius:0.9, color:'#E8C06B', speed:0.016, tilt:177,   period:'225 days',  temp:'465°C avg',     moons:0,   type:'Rocky'    },
      { id:'earth',   name:'Earth',   distance:22,  radius:1.0, color:'#4B9CD3', speed:0.010, tilt:23.5,  period:'365 days',  temp:'15°C avg',      moons:1,   type:'Rocky'    },
      { id:'mars',    name:'Mars',    distance:30,  radius:0.6, color:'#C1440E', speed:0.005, tilt:25,    period:'687 days',  temp:'-63°C avg',     moons:2,   type:'Rocky'    },
      { id:'jupiter', name:'Jupiter', distance:44,  radius:3.0, color:'#C88B3A', speed:0.002, tilt:3,     period:'12 years',  temp:'-110°C',        moons:95,  type:'Gas Giant' },
      { id:'saturn',  name:'Saturn',  distance:58,  radius:2.5, color:'#E4D191', speed:0.001, tilt:26.7,  period:'29 years',  temp:'-140°C',        moons:146, type:'Gas Giant' },
      { id:'uranus',  name:'Uranus',  distance:72,  radius:1.8, color:'#7DE8E8', speed:0.0005,tilt:97.8,  period:'84 years',  temp:'-197°C',        moons:28,  type:'Ice Giant' },
      { id:'neptune', name:'Neptune', distance:85,  radius:1.6, color:'#4B70DD', speed:0.0002,tilt:28,    period:'165 years', temp:'-201°C',        moons:16,  type:'Ice Giant' },
    ];

    
    // SCENE SETUP
  
    const scene    = new THREE.Scene();
    const camera   = new THREE.PerspectiveCamera(
      60, window.innerWidth / window.innerHeight, 0.1, 2000
    );
    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

  
    // LIGHTING
    
    const sunLight = new THREE.PointLight(0xFFFAE0, 2.5, 600);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x111133, 0.6));

    
    // STARFIELD

    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(6000);
    for (let i = 0; i < 6000; i++) {
      starPos[i] = (Math.random() - 0.5) * 1600;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
      color: 0xffffff, size: 0.25, sizeAttenuation: true
    })));

    //flying to planets
    function flyToPlanet(mesh) {
      const data = mesh.userData;
      tgtLook.set(mesh.position.x, mesh.position.y, mesh.position.z);
      tgtRadius = data.radius * 6 + 4;
    }


    // SUN
    
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(5, 32, 32),
      new THREE.MeshBasicMaterial({ color: '#FDB813' })
    );
    scene.add(sun);

    
    // BUILDing  ALL PLANETS FROM DATA ARRAY
    
    const planetMeshes = [];

    PLANETS.forEach(data => {
      // 1. Create the sphere mesh
      const geo = new THREE.SphereGeometry(data.radius, 32, 32);
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(data.color),
        roughness: 0.8,
        metalness: 0.1,
      });
      const mesh = new THREE.Mesh(geo, mat);

      // 2. Apply axial tilt
      mesh.rotation.z = (data.tilt * Math.PI) / 180;

      // 3. Store the data on the mesh for later use
      mesh.userData = data;

      // 4. Set starting position
      mesh.position.set(data.distance, 0, 0);

      // 5. Add to scene
      scene.add(mesh);

      // 6. Saturn rings — special case
      if (data.id === 'saturn') {
        const ringGeo = new THREE.RingGeometry(
          data.radius * 1.4,
          data.radius * 2.5,
          64
        );
        const ringMat = new THREE.MeshBasicMaterial({
          color: '#C8B560',
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.7
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        mesh.add(ring);
      }

      // 7. Build orbit ring
      const orbitPoints = [];
      for (let i = 0; i <= 128; i++) {
        const a = (i / 128) * Math.PI * 2;
        orbitPoints.push(new THREE.Vector3(
          Math.cos(a) * data.distance,
          0,
          Math.sin(a) * data.distance
        ));
      }
      const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints);
      const orbitLine = new THREE.Line(orbitGeo,
        new THREE.LineBasicMaterial({ color: 0x223355, transparent: true, opacity: 0.5 })
      );
      scene.add(orbitLine);

      // 8. Track angle for animation
      mesh._angle = Math.random() * Math.PI * 2;

      // 9. Store reference
      planetMeshes.push(mesh);
    });

    
    // CAMERA CONTROLS
    let camRadius = 90;
    let camTheta = Math.PI / 8;
    let camPhi = Math.PI / 3;
    let tgtTheta = Math.PI / 8;
    let tgtPhi = Math.PI / 3;
    let tgtRadius = 90;
    let lookTarget = new THREE.Vector3(0, 0, 0);
    let tgtLook = new THREE.Vector3(0, 0, 0);
  
    function updateCamera() {

      camTheta += (tgtTheta - camTheta) * 0.06;
      camPhi += (tgtPhi - camPhi) * 0.06;
      camRadius += (tgtRadius - camRadius) * 0.06;
      lookTarget.lerp(tgtLook, 0.06);

      camera.position.x = lookTarget.x + camRadius * Math.sin(camPhi) * Math.cos(camTheta);
      camera.position.y = lookTarget.y + camRadius * Math.cos(camPhi);
      camera.position.z = lookTarget.z + camRadius * Math.sin(camPhi) * Math.sin(camTheta);
      camera.lookAt(lookTarget);
    }
    updateCamera();

    renderer.domElement.addEventListener('mousedown', e => {
      isDragging = true;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    });


    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      tgtTheta -= (e.clientX - prevMouseX) * 0.005;
      tgtPhi = Math.max(0.15, Math.min(Math.PI / 2.1,
        tgtPhi + (e.clientY - prevMouseY) * 0.005));
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
      updateCamera();
    });

    renderer.domElement.addEventListener('wheel', e => {
      tgtRadius = Math.max(4, Math.min(300, tgtRadius + e.deltaY * 0.08));
      updateCamera();
    }, { passive: true });

  
    // RAYCASTING — click detection in 3D
    // For now — it finds which planet was clicked
  
    const raycaster = new THREE.Raycaster();
    const mouse     = new THREE.Vector2();

    renderer.domElement.addEventListener('click', e => {
      mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(planetMeshes);

      if (hits.length > 0) {
        flyToPlanet(hits[0].object);
        showInfo(hits[0].object.userData);
      }
    });

    // Hover
    window.addEventListener('mousemove', e => {
      mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(planetMeshes);
      const tip = document.getElementById('tooltip');
      if (hits.length > 0) {
        tip.textContent  = hits[0].object.userData.name;
        tip.style.opacity = '1';
        renderer.domElement.style.cursor = 'pointer';
      } else {
        tip.style.opacity = '0';
        renderer.domElement.style.cursor = 'default';
      }
    });


    // INFO PANEL
    let currentPlanetData = null;
    function showInfo(data) {
      currentPlanetData = data;
      document.getElementById('p-type-label').textContent = data.type;
      document.getElementById('p-name').textContent   = data.name;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector('[data-tab="facts"]').classList.add('active');
      renderTab('facts',data);
      document.getElementById('info-panel').classList.add('visible');
    }

    function renderTab(tab, data) {
  const content = document.getElementById('panel-content');
  if (tab === 'facts') {
    content.innerHTML =
      '<div class="fact-row"><span class="label">Type</span><span class="value">' + data.type + '</span></div>' +
      '<div class="fact-row"><span class="label">Orbit Period</span><span class="value">' + data.period + '</span></div>' +
      '<div class="fact-row"><span class="label">Temperature</span><span class="value">' + data.temp + '</span></div>' +
      '<div class="fact-row"><span class="label">Moons</span><span class="value">' + data.moons + '</span></div>';
  }
    if (tab === 'milestones') {
    content.innerHTML = data.milestones.map(m =>
      '<div class="milestone">' +
        '<div class="milestone-year">' + m.year + '</div>' +
        '<div class="milestone-event">' + m.event + '</div>' +
      '</div>'
    ).join('');
  }
  if (tab === 'funfact') {
    content.innerHTML = '<p style="color:rgba(200,223,245,0.75);line-height:1.8;font-size:0.8rem">' + data.fact + '</p>';
  }
}

document.getElementById('panel-tabs').addEventListener('click', e => {
  const tab = e.target.dataset.tab;
  if (!tab || !currentPlanetData) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  renderTab(tab, currentPlanetData);
});

document.getElementById('panel-close').addEventListener('click', () => {
  document.getElementById('info-panel').classList.remove('visible');
  tgtLook.set(0, 0, 0);
  tgtRadius = 90;
});
    
    // PAUSE + RESET

    let isPaused = false;
    document.getElementById('pause-btn').addEventListener('click', () => {
      isPaused = !isPaused;
      document.getElementById('pause-btn').textContent =
        isPaused ? '▶ Resume' : '⏸ Pause';
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      tgtTheta  = Math.PI / 8;
      tgtPhi    = Math.PI / 3;
      tgtRadius = 90;
      tgtLook.set(0, 0, 0);
      document.getElementById('info-panel').classList.remove('visible');
    });

    
    // RENDER LOOP

    function animate() {
      requestAnimationFrame(animate);

      if (!isPaused) {
        // Rotate sun
        sun.rotation.y += 0.002;

        // Orbit all planets
        planetMeshes.forEach((mesh, i) => {
          const data = PLANETS[i];
          mesh._angle += data.speed;
          mesh.position.x = Math.cos(mesh._angle) * data.distance;
          mesh.position.z = Math.sin(mesh._angle) * data.distance;
          mesh.rotation.y += 0.01;
        });
      }

      updateCamera();
      renderer.render(scene, camera);
    }

    animate();


    // RESIZE
  
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

  </script>
</body>
</html>
